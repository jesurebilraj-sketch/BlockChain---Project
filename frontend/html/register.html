<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Register Account — PDSChain</title>
<meta name="description" content="Register for a PDSChain account to join the transparent, blockchain-powered Public Distribution network." />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<link rel="stylesheet" href="../css/style.css" />
<link rel="stylesheet" href="../css/animations.css" />
<link rel="stylesheet" href="../css/components.css" />
<link rel="stylesheet" href="../css/auth.css" />
<link rel="stylesheet" href="../css/responsive.css" />
</head>
<body>
<a href="#register-main" class="skip-link">Skip to content</a>

<!-- ============== AUTH TOPBAR ============== -->
<header class="auth-topbar">
  <div class="container">
    <a href="index.html" class="back-link"><i class="bi bi-arrow-left" aria-hidden="true"></i> Back to Home</a>
    <div class="auth-topbar-actions">
      <span>Already registered?</span>
      <a href="login.html">Sign In</a>
    </div>
  </div>
</header>

<main id="register-main" class="auth-shell is-centered">
  <div class="auth-form-wrap is-wide">
    <div id="register-card-body">

      <div class="auth-form-header">
        <span class="eyebrow">PDSChain Public Registration</span>
        <h1>Create your account.</h1>
        <p>Register as a citizen beneficiary or food grain officer.</p>
      </div>

      <div class="form-status" id="register-status" role="alert" hidden></div>

      <form id="register-form" novalidate>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="reg-name">Full Name</label>
            <input class="form-input" type="text" id="reg-name" name="fullName" placeholder="e.g. Arun Kumar" autocomplete="name" required />
            <div class="form-hint" aria-live="polite"></div>
          </div>
          <div class="form-group">
            <label class="form-label" for="reg-email">Email Address</label>
            <input class="form-input" type="email" id="reg-email" name="email" placeholder="arun@example.com" autocomplete="email" required />
            <div class="form-hint" aria-live="polite"></div>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="reg-phone">Phone Number</label>
            <input class="form-input" type="tel" id="reg-phone" name="phone" placeholder="+91 98765 43210" autocomplete="tel" required />
            <div class="form-hint" aria-live="polite"></div>
          </div>
          <div class="form-group">
            <label class="form-label" for="reg-region">Region / District</label>
            <select class="form-select" id="reg-region" name="region">
              <option value="Chennai Central">Chennai Central</option>
              <option value="Chennai North">Chennai North</option>
              <option value="Chennai South">Chennai South</option>
              <option value="Chennai West">Chennai West</option>
              <option value="Chennai East">Chennai East</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="reg-password">Password (min 6 characters)</label>
            <div class="input-wrap">
              <input class="form-input has-icon" type="password" id="reg-password" name="password" placeholder="Create password" autocomplete="new-password" required />
              <button class="input-icon-btn" type="button" data-toggle-password="reg-password" aria-label="Show password">
                <i class="bi bi-eye" aria-hidden="true"></i>
              </button>
            </div>
            <div class="form-hint" aria-live="polite"></div>
          </div>
          <div class="form-group">
            <label class="form-label" for="reg-confirm">Confirm Password</label>
            <div class="input-wrap">
              <input class="form-input has-icon" type="password" id="reg-confirm" name="confirmPassword" placeholder="Confirm password" autocomplete="new-password" required />
              <button class="input-icon-btn" type="button" data-toggle-password="reg-confirm" aria-label="Show password">
                <i class="bi bi-eye" aria-hidden="true"></i>
              </button>
            </div>
            <div class="form-hint" aria-live="polite"></div>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Select Account Type</label>
          <div class="role-grid">
            <label class="role-card">
              <input type="radio" name="role" value="citizen" checked />
              <span class="role-radio"></span>
              <span class="role-name">Citizen / Beneficiary</span>
              <div class="role-note">View family rations &amp; on-chain receipts</div>
            </label>
            <label class="role-card">
              <input type="radio" name="role" value="shop" />
              <span class="role-radio"></span>
              <span class="role-name">Fair Price Shop</span>
              <div class="role-note">Distribute &amp; submit on-chain txns</div>
            </label>
            <label class="role-card">
              <input type="radio" name="role" value="warehouse" />
              <span class="role-radio"></span>
              <span class="role-name">Warehouse Officer</span>
              <div class="role-note">Dispatch stock &amp; manage transfers</div>
            </label>
            <label class="role-card">
              <input type="radio" name="role" value="validator" />
              <span class="role-radio"></span>
              <span class="role-name">Validator Node</span>
              <div class="role-note">FBA Consensus Observer</div>
            </label>
          </div>
        </div>

        <div class="checkbox-row" style="margin-top:14px;">
          <label class="checkbox-field">
            <input type="checkbox" id="reg-terms" name="terms" checked required />
            I agree to the terms of the simulated blockchain distribution prototype.
          </label>
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="register-submit" style="margin-top:14px;">
          Complete Registration <i class="bi bi-arrow-right" aria-hidden="true"></i>
        </button>
      </form>

      <p class="auth-switch">Already registered? <a href="login.html">Sign in here</a></p>
    </div>
  </div>
</main>

<div class="toast-stack" id="toast-stack" aria-live="polite"></div>

<footer class="auth-footer">
  <div class="container">
    <strong>PDSChain</strong> — Blockchain-Based Public Distribution System · © <span id="year">2026</span> PDSChain
  </div>
</footer>

<script src="../js/main.js"></script>
<script src="../js/auth.js"></script>
</body>
</html>
